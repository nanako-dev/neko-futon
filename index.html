<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="ga.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>猫 vs 布団カバー</title>
<meta name="description" content="布団カバーをかけたいのに、猫が乗ってくる。猫をそっとどかしながら、4つの角を留めよう。">
<meta property="og:title" content="猫 vs 布団カバー">
<meta property="og:description" content="布団カバーをかけたいのに、猫が乗ってくる。猫をそっとどかしながら、4つの角を留めよう。">
<style>
  :root { --bg:#f6efe4; --ink:#5a4636; --accent:#e58a8a; --panel:#fffaf3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Noto Sans JP",system-ui,sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
  .panel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--panel); border-radius:28px; padding:22px 22px 18px; width:min(92vw,360px); box-shadow:0 12px 40px rgba(90,70,54,.22); text-align:center; }
  .panel h1 { margin:0 0 4px; font-size:26px; letter-spacing:.04em; }
  .panel p { margin:4px 0 12px; font-size:14px; line-height:1.6; }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0 12px; }
  .chip { border:2px solid #e9dccb; background:#fff; border-radius:999px; padding:7px 12px; font-size:14px; cursor:pointer; color:var(--ink); }
  .chip.on { border-color:var(--accent); background:#fde9e9; }
  .btn { display:inline-block; border:0; background:var(--accent); color:#fff; font-size:18px; font-weight:700; padding:13px 28px; border-radius:999px; cursor:pointer; box-shadow:0 6px 0 #c96f6f; margin:4px; }
  .btn.sub { background:#fff; text-decoration:none; color:var(--ink); box-shadow:0 6px 0 #e3d6c5; font-size:15px; padding:11px 20px; }
  .btn:active { transform:translateY(3px); box-shadow:none; }
  #result { top:auto; bottom:3vh; transform:translateX(-50%); padding-top:16px; }
  #result h1 { font-size:22px; }
  #result .stat { font-size:28px; }
  .hidden { display:none; }
  .stat { font-size:34px; font-weight:800; margin:2px 0; }
  .small { font-size:12px; opacity:.7; }
  label.sec { display:block; font-size:12px; opacity:.7; margin-top:6px; }
  .howto { text-align:left; font-size:13px; line-height:1.7; background:#fff; border-radius:16px; padding:10px 14px; margin:0 0 12px; }
  .howto b { color:var(--accent); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="title" class="panel">
  <h1>猫 vs 布団カバー</h1>
  <p>布団カバーをかけたいのに、猫が乗ってくる。<br>猫は3匹まで増えます。4つの角を留めたら勝ち。</p>
  <div class="howto">
    <b>引っぱる</b>：カバーを下へ。真ん中を引かないとずれる<br>
    <b>持ち上げる</b>：猫をドラッグ。速いけどすぐ戻る<br>
    <b>なでる</b>：猫を長押し。時間はかかるが長く寝る<br>
    <b>おやつ</b>：右上から床へドラッグ。全員が集まる（2回）
  </div>
  <label class="sec">最初の猫をえらぶ</label>
  <div class="row" id="cats"></div>
  <label class="sec">カバーをえらぶ</label>
  <div class="row" id="covers"></div>
  <button class="btn" id="start">はじめる</button>
</div>

<div id="result" class="panel hidden">
  <h1 id="r-title">かけられた！</h1>
  <div class="stat" id="r-time">0.0秒</div>
  <p id="r-msg"></p>
  <button class="btn" id="again">もう一回</button>
  <button class="btn sub" id="save">画像を保存</button>
  <a class="btn sub" id="share" href="#" target="_blank" rel="noopener">Xでシェア</a>
  <div class="small" id="r-rank"></div>
</div>

<script>
'use strict';
// ---------- 設定 ----------
const W = 390, H = 760;
const FUTON = { x: 55, y: 150, w: 280, h: 440 };
const CUSHION = { x: 70, y: 700, r: 42 };
const TREAT_BTN = { x: W - 62, y: 96, w: 96, h: 34 };
const CAT_TYPES = [
  { id:'shiro', name:'しろ', body:'#fffdf7', ear:'#f6c1c8', stripe:null, patch:null },
  { id:'chatora', name:'茶トラ', body:'#efb46a', ear:'#f2b3a6', stripe:'#d58c3f', patch:null },
  { id:'kuro', name:'くろ', body:'#4a4442', ear:'#8c6f6b', stripe:null, patch:null },
  { id:'mike', name:'みけ', body:'#fffdf7', ear:'#f6c1c8', stripe:null, patch:['#f0a35a','#4a4442'] },
  { id:'hachi', name:'ハチワレ', body:'#8d8f99', ear:'#f2b3a6', stripe:null, patch:['#fffdf7'] },
];
const COVERS = [
  { id:'sakura', name:'さくら水玉', base:'#f9d3dc', dot:'#ffffff', pat:'dot' },
  { id:'sora', name:'そら縞', base:'#cfe3f5', dot:'#ffffff', pat:'stripe' },
  { id:'mint', name:'みんとチェック', base:'#d5efe1', dot:'#ffffff', pat:'check' },
  { id:'kinari', name:'きなり', base:'#f3e9d6', dot:'#ffffff', pat:'plain' },
];
const PERSONA = {
  mogura: { hint: 'もぐるのが好き', bubble: 'もぐ' },
  kado:   { hint: '角がすき', bubble: 'ぺりっ' },
  yobu:   { hint: '仲間を呼ぶ', bubble: 'ニャーオ！' },
};
const SPAWN_BASE = [14, 32];        // 2匹目・3匹目が来る秒
const PET_TIME = 2.4;               // なでる時間
const BED_SLEEP = 13;               // なでた後ベッドで寝る秒
const OCCUPY_LIMIT = 9;             // 全員が布団に居座ると負けになる秒
const MAX_SHIFT = 70;

// ---------- 状態 ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, cssScale = 1;
let catType = CAT_TYPES[1], coverType = COVERS[0];
let game = null, audio = null;

function newGame() {
  const g = {
    phase: 'pull',                 // pull → corners → done | lose
    coverY: 0, coverX: 0,
    corners: [false, false, false, false],
    t: 0, moves: 0, pets: 0, treats: 2, treat: null,
    pointer: null, cats: [], spawnIdx: 0, spawnAt: SPAWN_BASE.slice(),
    occupy: 0, bubbles: [], hearts: [], zz: [], confetti: [], msg: '', msgT: 0, shake: 0,
  };
  const c = makeCat(catType, 'mogura');
  c.x = FUTON.x + FUTON.w / 2 + 30; c.y = FUTON.y + FUTON.h * 0.45; c.state = 'sit'; c.timer = 2.2; c.dir = -1;
  g.cats.push(c);
  return g;
}
function makeCat(type, persona) {
  const side = Math.random() < 0.5 ? -1 : 1;
  return {
    type, persona,
    x: side < 0 ? -60 : W + 60, y: FUTON.y + 80 + Math.random() * (FUTON.h - 160),
    state: 'approach', timer: 0.6, goal: null, dir: side < 0 ? 1 : -1,
    tail: Math.random() * 6, blink: -Math.random() * 3, wig: 0, mood: 0,
    lifts: 0, petP: 0, cornerIdx: -1, eating: false,
  };
}
function spawnCat(persona) {
  const used = game.cats.map(c => c.type);
  const pool = CAT_TYPES.filter(t => !used.includes(t)); const type = pick(pool.length ? pool : CAT_TYPES);
  const c = makeCat(type, persona); game.cats.push(c);
  say(`${type.name}が来た（${PERSONA[persona].hint}）`);
  meow();
  return c;
}

// ---------- タイトルUI ----------
function chips(id, list, cur, set) {
  const el = document.getElementById(id); el.innerHTML = '';
  list.forEach(o => { const b = document.createElement('button'); b.className = 'chip' + (o === cur ? ' on' : ''); b.textContent = o.name; b.onclick = () => { set(o); chips(id, list, o, set); }; el.appendChild(b); });
}
chips('cats', CAT_TYPES, catType, o => catType = o);
chips('covers', COVERS, coverType, o => coverType = o);
document.getElementById('start').onclick = () => { ensureAudio(); document.getElementById('title').classList.add('hidden'); game = newGame(); say('もう猫が乗ってる'); };
document.getElementById('again').onclick = () => { document.getElementById('result').classList.add('hidden'); document.getElementById('title').classList.remove('hidden'); game = null; drawIdle(); };
document.getElementById('save').onclick = () => { const a = document.createElement('a'); a.download = 'neko-futon.png'; a.href = cv.toDataURL('image/png'); a.click(); };

// ---------- 音 ----------
function ensureAudio() { try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {} }
function tone(type, f0, f1, f2, dur, vol) {
  if (!audio) return; const t0 = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.linearRampToValueAtTime(f1, t0 + dur * 0.3); o.frequency.linearRampToValueAtTime(f2, t0 + dur * 0.9);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function meow(kind) { kind === 'sleepy' ? tone('triangle', 420, 520, 380, 0.45, 0.16) : kind === 'loud' ? tone('sawtooth', 500, 900, 600, 0.5, 0.08) : tone('triangle', 560, 880, 480, 0.4, 0.18); }
function snap() { tone('square', 1200, 600, 300, 0.08, 0.12); }
function rip() { tone('sawtooth', 300, 200, 120, 0.18, 0.06); }
function purr() { tone('sine', 90, 110, 90, 0.25, 0.1); }

// ---------- 入力 ----------
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / cssScale, y: (e.clientY - r.top) / cssScale }; }
function catAt(p) {
  let best = null, bd = 1e9;
  for (const c of game.cats) {
    if (c.state === 'victory') continue;
    const r = c.state === 'burrow' ? 52 : 44, d = Math.hypot(p.x - c.x, p.y - c.y);
    if (d < r && d < bd) { best = c; bd = d; }
  }
  return best;
}
function inRect(p, r) { return Math.abs(p.x - r.x) < r.w / 2 && Math.abs(p.y - r.y) < r.h / 2; }
cv.addEventListener('pointerdown', e => {
  if (!game || game.phase === 'done' || game.phase === 'lose') return;
  ensureAudio();
  const p = toLocal(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (game.pointer) return;
  if (inRect(p, TREAT_BTN)) { if (game.treats > 0) game.pointer = { mode: 'treat', x: p.x, y: p.y }; else say('おやつはもうない'); return; }
  const c = catAt(p);
  if (c) {
    if (c.state === 'bed') { bubble(c.x, c.y - 60, 'zzz'); return; }
    game.pointer = { mode: 'catdown', cat: c, x: p.x, y: p.y, sx: p.x, sy: p.y, hold: 0 };
    return;
  }
  if (game.phase === 'corners') {
    const idx = cornerAt(p);
    if (idx >= 0 && !game.corners[idx]) { tryFasten(idx); return; }
  }
  if (p.x > FUTON.x - 24 && p.x < FUTON.x + FUTON.w + 24 && p.y > FUTON.y - 50 && p.y < FUTON.y + FUTON.h + 30) {
    game.pointer = { mode: 'cover', lastX: p.x, lastY: p.y, x: p.x, y: p.y };
  }
});
cv.addEventListener('pointermove', e => {
  if (!game || !game.pointer) return;
  const p = toLocal(e), pt = game.pointer; pt.x = p.x; pt.y = p.y;
  if (pt.mode === 'cover') { pullCover(p.x - pt.lastX, p.y - pt.lastY, p.x); pt.lastX = p.x; pt.lastY = p.y; }
  else if (pt.mode === 'catdown' || pt.mode === 'pet') {
    if (Math.hypot(p.x - pt.sx, p.y - pt.sy) > 14) startCarry(pt);
  }
});
function release() {
  if (!game || !game.pointer) return;
  const pt = game.pointer; game.pointer = null;
  if (pt.mode === 'cat') dropCat(pt.cat, pt.x, pt.y);
  else if (pt.mode === 'pet') { const c = pt.cat; if (c.state === 'pet') { c.state = 'sit'; c.timer = 1; c.petP = 0; bubble(c.x, c.y - 60, 'え、もう？'); } }
  else if (pt.mode === 'treat') placeTreat(pt.x, pt.y);
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

function startCarry(pt) {
  const c = pt.cat; pt.mode = 'cat';
  c.state = 'carried'; c.mood = 1; c.petP = 0; c.lifts++; c.eating = false; game.moves++;
  bubble(c.x, c.y - 60, pick(['にゃ', 'にゃ？', 'んにゃ', 'ﾆｬｰ']));
  if (c.persona === 'yobu') {
    meow('loud'); bubble(c.x, c.y - 84, PERSONA.yobu.bubble);
    const g = game; if (g.spawnIdx < g.spawnAt.length) { g.spawnAt[g.spawnIdx] = Math.min(g.spawnAt[g.spawnIdx], g.t + 1.5); say('仲間を呼んだ！'); }
  } else meow();
}
function pullCover(dx, dy, px) {
  const g = game;
  if (g.phase === 'corners' && g.coverY >= FUTON.h - 1 && dy > 0) dy = 0;
  let ny = Math.max(0, Math.min(FUTON.h, g.coverY + dy * 0.9));
  if (dy > 0) for (const c of g.cats) {
    if ((c.state === 'sit' || c.state === 'walk' || c.state === 'scratch' || c.state === 'sneak') && onFuton(c.x, c.y)) {
      const limit = c.y - FUTON.y - 42;
      if (ny > limit && g.coverY <= limit + 1) { ny = Math.max(g.coverY, limit); if (Math.random() < 0.04) bubble(c.x, c.y - 60, pick(['…', 'じー', 'にゃ'])); }
    }
  }
  g.coverY = ny;
  // 横ずれ：端を引くとそちらへずれる。横ドラッグで直せる
  const cxm = FUTON.x + FUTON.w / 2;
  g.coverX += dx * 0.7 + (dy > 0 ? (px - cxm) / (FUTON.w / 2) * dy * 0.3 : 0);
  g.coverX = Math.max(-MAX_SHIFT, Math.min(MAX_SHIFT, g.coverX));
  if (g.phase === 'pull' && g.coverY >= FUTON.h - 1) { g.phase = 'corners'; say(Math.abs(g.coverX) > 16 ? 'ずれてる。横にドラッグして直そう' : '4つの角をタップして留めよう'); }
}
function tryFasten(i) {
  const g = game, cp = cornerPos(i);
  if (Math.abs(g.coverX) > 16) { say('カバーがずれてる。横にドラッグして直そう'); g.shake = 0.1; return; }
  for (const c of g.cats) if (!['floor', 'bed', 'eat', 'carried', 'tobed'].includes(c.state) && Math.hypot(c.x - cp.x, c.y - cp.y) < 70) { say('猫がじゃまで留められない…'); bubble(c.x, c.y - 60, 'ふみふみ'); return; }
  g.corners[i] = true; snap(); g.shake = 0.12;
  if (g.corners.every(Boolean)) finish(true);
}
function dropCat(c, x, y) {
  c.mood = 0;
  if (onFuton(x, y)) {
    c.x = Math.max(FUTON.x + 40, Math.min(FUTON.x + FUTON.w - 40, x)); c.y = Math.max(FUTON.y + 40, Math.min(FUTON.y + FUTON.h - 30, y));
    c.state = 'sit'; c.timer = 1 + Math.random(); bubble(c.x, c.y - 60, pick(['ここでいい', 'にゃ', 'ふむ'])); say('布団の上に置いちゃった'); return;
  }
  const nearBed = Math.hypot(x - CUSHION.x, y - CUSHION.y) < 70 && !game.cats.some(o => o !== c && (o.state === 'bed' || (o.state === 'floor' && Math.hypot(o.x - CUSHION.x, o.y - CUSHION.y) < 20)));
  c.x = nearBed ? CUSHION.x : Math.max(30, Math.min(W - 30, x));
  c.y = nearBed ? CUSHION.y - 4 : Math.max(60, Math.min(H - 30, y));
  c.state = 'floor';
  const base = Math.max(1.2, 4.2 - c.lifts * 0.7 - game.t * 0.02);   // 持ち上げるたびに早く戻る
  c.timer = nearBed ? base * 1.8 : base; c.mood = nearBed ? 2 : 0;
  if (nearBed) { bubble(c.x, c.y - 60, 'ふかふか'); meow('sleepy'); }
}
function placeTreat(x, y) {
  const g = game;
  if (onFuton(x, y) || y < 130) { say('布団の上はダメ。床に置こう'); return; }
  g.treats--; g.treat = { x: Math.max(30, Math.min(W - 30, x)), y: Math.max(140, Math.min(H - 20, y)), t: 6.5 };
  for (const c of g.cats) if (!['carried', 'bed', 'victory', 'pet', 'tobed'].includes(c.state)) { c.state = 'eat'; c.goal = null; c.mood = 0; c.eating = false; bubble(c.x, c.y - 60, '！'); }
  say('みんな集まってきた'); meow();
}
function finish(win) {
  const g = game; g.phase = win ? 'done' : 'lose'; g.doneAt = g.t; g.pointer = null; g.treat = null;
  const spots = [[0.5, 0.55], [0.28, 0.32], [0.72, 0.78]];
  g.cats.forEach((c, i) => { c.state = 'victory'; c.tx = FUTON.x + FUTON.w * spots[i % 3][0]; c.ty = FUTON.y + FUTON.h * spots[i % 3][1]; c.timer = 0; c.mood = 2; });
  if (win) for (let i = 0; i < 70; i++) g.confetti.push({ x: W / 2, y: FUTON.y + 100, vx: (Math.random() - .5) * 460, vy: -Math.random() * 400 - 80, c: pick(['#f9b4c0', '#ffd98a', '#b8e0d2', '#cfe3f5', '#fff']), r: 4 + Math.random() * 5, a: Math.random() * 6 });
  setTimeout(() => {
    const m = g.moves, n = g.cats.length;
    document.getElementById('r-title').textContent = win ? 'かけられた！' : '猫の勝ち…';
    document.getElementById('r-time').textContent = g.doneAt.toFixed(1) + '秒';
    document.getElementById('r-msg').textContent = win
      ? (m === 0 ? `猫${n}匹を一度も持ち上げずにかけた。奇跡。` : `猫${n}匹。持ち上げ${m}回、なでた${g.pets}回`)
      : `${n}匹に布団を占領された。今夜は床で寝よう。`;
    document.getElementById('r-rank').textContent = !win ? '称号：猫のベッド係' : m <= 2 ? '称号：猫に好かれている' : m <= 6 ? '称号：根気がある' : '称号：猫のほうが上手';
    const text = win ? `猫${n}匹をどかしながら布団カバーをかけた：${g.doneAt.toFixed(1)}秒（持ち上げ${m}回・なでた${g.pets}回）` : `${g.doneAt.toFixed(1)}秒で猫${n}匹に布団を占領された。今夜は床で寝る。`;
    document.getElementById('share').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text + '\n#猫vs布団カバー\n') + '&url=' + encodeURIComponent(location.href.split('#')[0]);
    document.getElementById('result').classList.remove('hidden');
  }, 2000);
}

// ---------- 猫AI ----------
function onFuton(x, y) { return x > FUTON.x + 10 && x < FUTON.x + FUTON.w - 10 && y > FUTON.y + 10 && y < FUTON.y + FUTON.h - 10; }
function randFutonPoint() { return { x: FUTON.x + 50 + Math.random() * (FUTON.w - 100), y: FUTON.y + 60 + Math.random() * (FUTON.h - 110) }; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function bubble(x, y, text) { game.bubbles.push({ x, y, text, t: 1.4 }); }
function say(m) { game.msg = m; game.msgT = 2.4; }
function cornerPos(i) { const f = FUTON, m = 8; return [{ x: f.x + m, y: f.y + m }, { x: f.x + f.w - m, y: f.y + m }, { x: f.x + m, y: f.y + f.h - m }, { x: f.x + f.w - m, y: f.y + f.h - m }][i]; }
function cornerAt(p) { for (let i = 0; i < 4; i++) { const c = cornerPos(i); if (Math.hypot(p.x - c.x, p.y - c.y) < 34) return i; } return -1; }
function cornerSeat(i) { const p = cornerPos(i); return { x: p.x + (i % 2 ? -40 : 40), y: p.y + (i < 2 ? 42 : -36) }; }
function onFutonBusy(c) { return ['sit', 'walk', 'sneak', 'burrow', 'scratch'].includes(c.state) && onFuton(c.x, c.y); }

function updateCat(c, dt) {
  const g = game;
  c.tail += dt * 4; c.blink -= dt; if (c.blink < -3) c.blink = 0.12 + Math.random() * 0.1;
  const speed = c.state === 'eat' ? 150 : 95;
  const moveTo = (tx, ty) => {
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d < 3) return true;
    const s = Math.min(d, speed * dt); c.x += dx / d * s; c.y += dy / d * s; c.dir = dx < 0 ? -1 : 1; c.wig += dt * 10;
    return false;
  };
  const underCover = () => onFuton(c.x, c.y) && c.y < FUTON.y + g.coverY - 20 && Math.abs(c.x - (FUTON.x + FUTON.w / 2 + g.coverX)) < FUTON.w / 2;
  const goBurrow = () => { c.state = 'burrow'; c.timer = 3 + Math.random() * 2; bubble(c.x, c.y - 60, pick(['もぐ', 'もぞもぞ'])); };
  switch (c.state) {
    case 'approach': {
      c.timer -= dt; if (c.timer > 0) return;

  for (const sx of [-1, 1]) {
    ctx.fillStyle = T.body; ctx.beginPath(); ctx.moveTo(sx * (hr - 4), hy + 2); ctx.lineTo(sx * (hr + 9), hy + 7); ctx.lineTo(sx * (hr - 1), hy + 11); ctx.lineTo(sx * (hr + 8), hy + 16); ctx.lineTo(sx * (hr - 4), hy + 20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx * (hr - 2), hy + 2); ctx.lineTo(sx * (hr + 9), hy + 7); ctx.lineTo(sx * (hr - 1), hy + 11); ctx.lineTo(sx * (hr + 8), hy + 16); ctx.lineTo(sx * (hr - 3), hy + 20); ctx.stroke();
  }
  // 模様
  if (T.id === 'hachi') { ctx.fillStyle = '#fffdf7'; ctx.beginPath(); ctx.moveTo(-33, hy + 4); ctx.quadraticCurveTo(-10, hy - 8, 0, hy - 20); ctx.quadraticCurveTo(10, hy - 8, 33, hy + 4); ctx.quadraticCurveTo(28, hy + 36, 0, hy + 32); ctx.quadraticCurveTo(-28, hy + 36, -33, hy + 4); ctx.fill(); }
  if (T.id === 'mike') { ctx.fillStyle = '#f0a35a'; ctx.beginPath(); ctx.ellipse(-15, hy - 18, 13, 9, .5, 0, 7); ctx.fill(); ctx.fillStyle = '#4a4442'; ctx.beginPath(); ctx.ellipse(17, hy - 16, 11, 8, -.5, 0, 7); ctx.fill(); }
  if (T.stripe) { ctx.strokeStyle = T.stripe; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, hy - 29); ctx.lineTo(0, hy - 17); ctx.moveTo(-9, hy - 27); ctx.lineTo(-7, hy - 18); ctx.moveTo(9, hy - 27); ctx.lineTo(7, hy - 18); ctx.stroke(); }
  // ほっぺ
  ctx.fillStyle = pet || carried ? 'rgba(243,120,140,.6)' : 'rgba(243,150,160,.45)';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 21, hy + 13, 8, 5, 0, 0, 7); ctx.fill(); }
  // 目
  const ey = hy + 5, eyeCol = gold ? '#f2c94c' : '#3b2e26';
  ctx.lineCap = 'round';
  if (sleep) { ctx.strokeStyle = gold ? '#fff7e6' : '#3b2e26'; ctx.lineWidth = 2.4; for (const ex of [-13, 13]) { ctx.beginPath(); ctx.arc(ex, ey - 2, 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); } }
  else if (pet) { ctx.strokeStyle = gold ? '#fff7e6' : '#3b2e26'; ctx.lineWidth = 2.4; for (const ex of [-13, 13]) { ctx.beginPath(); ctx.arc(ex, ey + 4, 5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); } }
  else if (c.blink > 0) { ctx.strokeStyle = gold ? '#fff7e6' : '#3b2e26'; ctx.lineWidth = 2.4; for (const ex of [-13, 13]) { ctx.beginPath(); ctx.moveTo(ex - 5, ey); ctx.lineTo(ex + 5, ey); ctx.stroke(); } }
  else {
    for (const ex of [-13, 13]) {
      const ry = sleepy ? 4 : 6.5, ryp = sleepy ? 3.5 : 5.8;
      ctx.fillStyle = eyeCol; ctx.beginPath(); ctx.ellipse(ex, ey + (sleepy ? 2 : 0), 5.5, ry, 0, 0, 7); ctx.fill();
      if (gold) { ctx.fillStyle = '#3b2e26'; ctx.beginPath(); ctx.ellipse(ex, ey + (sleepy ? 2 : 0), 2.8, ryp, 0, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex - 2, ey - (sleepy ? 0 : 2.5), sleepy ? 1.8 : 2.2, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(ex + 2.4, ey + 2.4, 1, 0, 7); ctx.fill();
    }
  }
  // 鼻と口
  ctx.fillStyle = '#e88a95'; ctx.beginPath(); ctx.ellipse(0, hy + 13, 3, 2.2, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = gold ? 'rgba(255,247,230,.9)' : '#6b544a'; ctx.lineWidth = 1.6;
  if (eating) { ctx.fillStyle = '#c96a78'; ctx.beginPath(); ctx.ellipse(0, hy + 19, 3, 2.6 + Math.abs(Math.sin(c.tail * 3)) * 1.5, 0, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(0, hy + 15); ctx.quadraticCurveTo(-2.5, hy + 19, -6, hy + 16.5); ctx.moveTo(0, hy + 15); ctx.quadraticCurveTo(2.5, hy + 19, 6, hy + 16.5); ctx.stroke(); }
  // ひげ
  ctx.strokeStyle = gold ? 'rgba(255,247,230,.55)' : 'rgba(90,70,54,.35)'; ctx.lineWidth = 1.1;
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 25, hy + 11); ctx.lineTo(sx * 40, hy + 7); ctx.moveTo(sx * 25, hy + 15); ctx.lineTo(sx * 40, hy + 17); ctx.stroke(); }
  ctx.restore();
  ctx.restore();
  if (pet) { ctx.strokeStyle = 'rgba(229,138,138,.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(c.x, c.y, 58, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * c.petP); ctx.stroke(); }
  if (!carried && !sleep && c.state !== 'victory') { ctx.fillStyle = 'rgba(90,70,54,.55)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(PERSONA[c.persona].hint, c.x, c.y + 62); }
}
function drawHUD() {
  const g = game;
  ctx.fillStyle = 'rgba(255,250,243,.9)'; rr(14, 16, W - 28, 50, 16); ctx.fill();
  ctx.fillStyle = '#5a4636'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText((g.phase === 'done' || g.phase === 'lose' ? g.doneAt : g.t).toFixed(1) + '秒', 28, 48);
  ctx.font = '14px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`猫${g.cats.length}匹　持ち上げ${g.moves}回　${Math.round(g.coverY / FUTON.h * 100)}%`, W - 28, 47);
  const b = TREAT_BTN, on = g.treats > 0 && g.phase !== 'done' && g.phase !== 'lose';
  ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.5)'; ctx.strokeStyle = on ? '#8fb6d8' : '#ccc'; ctx.lineWidth = 2.5;
  rr(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 17); ctx.fill(); ctx.stroke();
  drawTreat(b.x - 26, b.y + 2, 0.6);
  ctx.fillStyle = on ? '#5a4636' : '#aaa'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`おやつ ×${g.treats}`, b.x - 6, b.y + 5);
  if (g.occupy > 0.3 && (g.phase === 'pull' || g.phase === 'corners')) {
    const w = 170, x = 30, y = 86, p = Math.min(1, g.occupy / OCCUPY_LIMIT);
    ctx.fillStyle = 'rgba(90,70,54,.85)'; rr(x - 10, y - 8, w + 20, 34, 17); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('布団が占領されそう', x, y + 4);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x, y + 10, w, 8, 4); ctx.fill();
    ctx.fillStyle = p > 0.7 ? '#ff7b7b' : '#ffd98a'; rr(x, y + 10, w * p, 8, 4); ctx.fill();
  } else if (g.msgT > 0) {
    ctx.globalAlpha = Math.min(1, g.msgT); ctx.fillStyle = 'rgba(90,70,54,.85)'; rr(20, 78, W - 40 - 110, 36, 18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(g.msg, 20 + (W - 40 - 110) / 2, 101); ctx.globalAlpha = 1;
  }
  for (const b2 of g.bubbles) {
    ctx.globalAlpha = Math.min(1, b2.t * 2);
    ctx.font = 'bold 14px sans-serif'; const w = ctx.measureText(b2.text).width + 20;
    ctx.fillStyle = '#fff'; rr(b2.x - w / 2, b2.y - 26, w, 28, 14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b2.x - 4, b2.y + 2); ctx.lineTo(b2.x + 4, b2.y + 2); ctx.lineTo(b2.x, b2.y + 9); ctx.fill();
    ctx.fillStyle = '#5a4636'; ctx.textAlign = 'center'; ctx.fillText(b2.text, b2.x, b2.y - 7);
    ctx.globalAlpha = 1;
  }
  for (const h of g.hearts) { ctx.globalAlpha = h.t; ctx.fillStyle = '#f07a93'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('♥', h.x, h.y); ctx.globalAlpha = 1; }
  for (const z of g.zz) { ctx.globalAlpha = Math.min(1, z.t); ctx.fillStyle = '#5a4636'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('z', z.x, z.y); ctx.globalAlpha = 1; }
  for (const f of g.confetti) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a); ctx.fillStyle = f.c; ctx.fillRect(-f.r / 2, -f.r / 2, f.r, f.r * 0.6); ctx.restore(); }
  if (g.phase === 'done' || g.phase === 'lose') { ctx.fillStyle = 'rgba(90,70,54,.6)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('猫 vs 布団カバー', W / 2, H - 14); }
}
function draw() {
  ctx.save(); ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (game.shake > 0) ctx.translate((Math.random() - .5) * 4, (Math.random() - .5) * 4);
  drawRoom(); drawFuton(); drawCover();
  if (game.treat) { const tr = game.treat; drawTreat(tr.x, tr.y, 1); ctx.strokeStyle = 'rgba(143,182,216,.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(tr.x, tr.y, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (tr.t / 6.5)); ctx.stroke(); }
  const cats = [...game.cats].sort((a, b) => a.y - b.y);
  for (const c of cats) if (c.state !== 'carried') drawCat(c);
  drawHUD();
  for (const c of cats) if (c.state === 'carried') drawCat(c);
  const pt = game.pointer; if (pt && pt.mode === 'treat') drawTreat(pt.x, pt.y - 20, 1.1);
  ctx.restore();
}
function drawIdle() {
  const keep = game;
  game = newGame(); game.cats[0].x = FUTON.x + 150; game.cats[0].y = FUTON.y + 260;
  draw(); game = keep;
}

// ---------- サイズ ----------
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  cssScale = Math.min(vw / W, vh / H);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * cssScale * dpr); cv.height = Math.round(H * cssScale * dpr);
  cv.style.width = Math.round(W * cssScale) + 'px'; cv.style.height = Math.round(H * cssScale) + 'px';
  scale = cssScale * dpr;
  if (!game) drawIdle(); else draw();
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
